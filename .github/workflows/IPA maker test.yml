def write_cyber_icon_png(path, w=256, h=256):
raw_rows = []
for y in range(h):
ny = y / h
br, bg, bb = int(10 + 38 * ny), int(6 + 14 * ny), int(28 + 60 * ny)
row = bytearray([0])
for x in range(w):
nx = x / w
r, g, b = br, bg, bb
dx_s, dy_s = nx - 0.5, ny - 0.68
if dx_sdx_s + dy_sdy_s < 0.075 and int(y) % 8 not in (0, 1):
r, g, b = 244, max(0, min(255, 63 + int((0.68 - ny) * 400))), 140
if 0.68 <= nx <= 0.86 and (ny < 0.28 or ny > 0.64):
r, g, b = (110, 231, 183) if (nx < 0.705 or nx > 0.835 or (0.25 < ny < 0.28) or (0.64 < ny < 0.67)) else (16, 185, 129)
bx, by = (nx - 0.38) / 0.17, (ny - 0.46) / 0.13
if bxbx + byby <= 1.0:
r, g, b = (103, 232, 249) if (bxbx + byby > 0.78) else (34, 211, 238)
wx, wy = (nx - 0.33) / 0.10, (ny - 0.48) / 0.075
if wxwx + wywy <= 1.0:
r, g, b = 232, 121, 249
if 0.53 <= nx <= 0.63 and abs(ny - 0.46) < (0.63 - nx) * 0.45:
r, g, b = 250, 204, 21
ex, ey = nx - 0.45, ny - 0.42
if exex + eyey <= 0.0012:
r, g, b = (9, 13, 22) if (exex + eyey <= 0.00035) else (255, 255, 255)
row.extend((r, g, b))
raw_rows.append(bytes(row))
raw_data = b"".join(raw_rows)
def chunk(tag, data):
return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
png = (
b"\x89PNG\r\n\x1a\n"
+ chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
+ chunk(b"IDAT", zlib.compress(raw_data, 6))
+ chunk(b"IEND", b"")
)
with open(path, "wb") as pf:
pf.write(png)
