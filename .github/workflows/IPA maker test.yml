swift_host = """import UIKit
import WebKit
import AVFoundation
@main
class AppDelegate: UIResponder, UIApplicationDelegate {
var window: UIWindow?
func application(
_ application: UIApplication,
didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
) -> Bool {
try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [.mixWithOthers])
try? AVAudioSession.sharedInstance().setActive(true)
let window = UIWindow(frame: UIScreen.main.bounds)
window.backgroundColor = UIColor(red: 7.0/255.0, green: 6.0/255.0, blue: 20.0/255.0, alpha: 1.0)
window.rootViewController = UniversalGameViewController()
window.makeKeyAndVisible()
self.window = window
return true
}
}
class UniversalGameViewController: UIViewController, WKScriptMessageHandler, WKNavigationDelegate, UIScrollViewDelegate {
private var webView: WKWebView!
override var prefersStatusBarHidden: Bool { true }
override var preferredScreenEdgesDeferringSystemGestures: UIRectEdge { .all }
override func viewDidLoad() {
super.viewDidLoad()
let bg = UIColor(red: 7.0/255.0, green: 6.0/255.0, blue: 20.0/255.0, alpha: 1.0)
view.backgroundColor = bg
let userContent = WKUserContentController()
userContent.add(self, name: "haptic")
let config = WKWebViewConfiguration()
config.userContentController = userContent
config.allowsInlineMediaPlayback = true
config.mediaTypesRequiringUserActionForPlayback = []
config.preferences.javaScriptCanOpenWindowsAutomatically = false
webView = WKWebView(frame: .zero, configuration: config)
webView.translatesAutoresizingMaskIntoConstraints = false
webView.isOpaque = false
webView.backgroundColor = bg
webView.scrollView.backgroundColor = bg
webView.scrollView.isScrollEnabled = false
webView.scrollView.bounces = false
webView.scrollView.panGestureRecognizer.isEnabled = false
webView.scrollView.pinchGestureRecognizer?.isEnabled = false
webView.scrollView.contentInsetAdjustmentBehavior = .never
webView.scrollView.delegate = self
webView.allowsLinkPreview = false
webView.isMultipleTouchEnabled = true
webView.navigationDelegate = self
view.addSubview(webView)
NSLayoutConstraint.activate([
webView.topAnchor.constraint(equalTo: view.topAnchor),
webView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
webView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
webView.trailingAnchor.constraint(equalTo: view.trailingAnchor)
])
if let indexURL = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "WebBundle") {
webView.loadFileURL(indexURL, allowingReadAccessTo: indexURL.deletingLastPathComponent())
} else if let rootURL = Bundle.main.url(forResource: "index", withExtension: "html") {
webView.loadFileURL(rootURL, allowingReadAccessTo: rootURL.deletingLastPathComponent())
}
}
func viewForZooming(in scrollView: UIScrollView) -> UIView? {
return nil
}
func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
guard message.name == "haptic", let style = message.body as? String else { return }
