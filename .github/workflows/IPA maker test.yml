name: Universal iOS Game & App .IPA Builder
on:
workflow_dispatch:
inputs:
app_name:
description: "App Display Name on iPhone Home Screen"
required: false
default: "Cyber Arcade"
bundle_id:
description: "App Bundle ID (e.g. com.cyberwing.flappyremix)"
required: false
default: "com.cyberwing.flappyremix"
orientation:
description: "Screen Orientation (portrait, landscape, or all)"
required: false
default: "all"
push:
branches: [ main, master ]
jobs:
build-ipa:
runs-on: macos-latest
env:
INPUT_APP_NAME: ${{ github.event.inputs.app_name || 'Cyber Arcade' }}
INPUT_BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.cyberwing.flappyremix' }}
INPUT_ORIENTATION: ${{ github.event.inputs.orientation || 'all' }}
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Assemble Universal iOS Project (Native Swift / SpriteKit / 3-in-1 Arcade)
run: |
python3 - << 'PYEOF'
import base64
import glob
import json
import os
import plistlib
import re
import shutil
import struct
import subprocess
import zlib
app_name = os.environ.get("INPUT_APP_NAME", "Cyber Arcade").strip() or "Cyber Arcade"
bundle_id = os.environ.get("INPUT_BUNDLE_ID", "com.cyberwing.flappyremix").strip() or "com.cyberwing.flappyremix"
orientation_mode = os.environ.get("INPUT_ORIENTATION", "all").strip().lower()
target_name = re.sub(r"[^A-Za-z0-9]", "", app_name) or "UniversalGameApp"
if target_name[0].isdigit():
target_name = "App" + target_name
build_dir = os.path.abspath("_ios_build_workspace")
if os.path.exists(build_dir):
shutil.rmtree(build_dir)
os.makedirs(build_dir, exist_ok=True)
web_bundle_dir = os.path.join(build_dir, "WebBundle")
os.makedirs(web_bundle_dir, exist_ok=True)
repo_swift_files = []
repo_web_files = []
user_icon_file = None
for root, dirs, files in os.walk("."):
dirs[:] = [
d for d in dirs
if not d.startswith(".")
and d not in ("_ios_build_workspace", "Payload", "build", "FlappyRemix_Xcode_IPA")
]
for f in files:
if f.startswith("."):
continue
full_p = os.path.join(root, f)
low = f.lower()
if low in ("icon.png", "icon.jpg", "icon.jpeg", "appicon.png") and user_icon_file is None:
user_icon_file = full_p
elif low.endswith(".swift"):
repo_swift_files.append(full_p)
elif low.endswith((".html", ".htm", ".css", ".js", ".wasm", ".json", ".mp3", ".wav", ".ogg", ".png", ".jpg", ".jpeg", ".svg", ".glb", ".gltf")):
repo_web_files.append(full_p)
has_custom_swift = len(repo_swift_files) > 0
has_custom_html = any(f.lower().endswith((".html", ".htm")) for f in repo_web_files)
print(f"[Universal IPA Builder] Target: {target_name} ({app_name}) | Bundle ID: {bundle_id}")
print(f"[Universal IPA Builder] Custom Swift: {has_custom_swift} | Custom HTML: {has_custom_html}")
if has_custom_swift:
for sf in repo_swift_files:
shutil.copy2(sf, os.path.join(build_dir, os.path.basename(sf)))
if has_custom_html:
for wf in repo_web_files:
rel = os.path.relpath(wf, ".")
dest = os.path.join(web_bundle_dir, rel)
os.makedirs(os.path.dirname(dest), exist_ok=True)
shutil.copy2(wf, dest)
else:
if has_custom_html:
for wf in repo_web_files:
rel = os.path.relpath(wf, ".")
dest = os.path.join(web_bundle_dir, rel)
os.makedirs(os.path.dirname(dest), exist_ok=True)
shutil.copy2(wf, dest)
index_candidate = os.path.join(web_bundle_dir, "index.html")
if not os.path.exists(index_candidate):
htmls = [f for f in repo_web_files if f.lower().endswith((".html", ".htm"))]
shutil.copy2(htmls[0], index_candidate)
else:
